name: Publication QA
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages and required fonts
        run: bash scripts/setup.sh
      - name: Regression checks
        run: npm test
      - name: Build and verify all specimens
        run: |
          npm run starter
          npm run documents
          mkdir -p output/renders/proposal output/renders/report
          pdftoppm -png -r 110 output/pdf/ocean-proposal-reference.pdf output/renders/proposal/page
          pdftoppm -png -r 110 output/pdf/ocean-report-reference.pdf output/renders/report/page
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-publication-specimens
          path: |
            output/pdf/
            output/pptx/
            output/renders/
          retention-days: 14
